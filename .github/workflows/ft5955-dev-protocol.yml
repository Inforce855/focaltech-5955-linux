name: FT5955 independent MOH protocol dev offline tests

on:
  push:
    branches:
      - feature/kde-lock-auth-preflight-20261018
    paths:
      - "tools/ft5955_dev_*.py"
      - "tools/ft5955_engine_broker.py"
      - "tools/build_ft5955_moh_template_dev.py"
      - "tools/activate_ft5955_dev_protocol.sh"
      - "tools/switch_ft5955_hardware_to_dev_gateway.sh"
      - "systemd/ft5955-engine-dev-protocol.service"
      - "tests/test_ft5955_dev_protocol_offline.py"
      - ".github/workflows/ft5955-dev-protocol.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Syntax-check committed Python and installer
        run: |
          python3 -m py_compile tools/ft5955_dev_template_gateway.py tools/ft5955_dev_template_launcher.py tools/ft5955_dev_protocol_server.py tools/ft5955_dev_relay.py tools/ft5955_engine_broker.py tools/build_ft5955_moh_template_dev.py
          bash -n tools/activate_ft5955_dev_protocol.sh
          bash -n tools/switch_ft5955_hardware_to_dev_gateway.sh
      - name: Offline protocol tests (fake subprocess only)
        run: python3 -m unittest discover -s tests -p test_ft5955_dev_protocol_offline.py -v
      - name: Existing non-root synthetic broker regression
        run: python3 tools/test_ft5955_engine_broker_synthetic.py
